name: Quality Gate

# 非阻断的质量痕迹：测试必须过（任何红色都是有判断的回归），tsc 只记录不拦截
# （这份代码预存了大量历史性 tsc 错误，一律由 models 修，哪天需要收那里可开成阻断）。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Vitest（失败即失败）测试必须绿
        run: pnpm exec vitest run

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: TypeScript 检查（记录，不拦住合并）
        run: pnpm exec tsc --noEmit
        continue-on-error: true
